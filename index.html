size:15px;font-family:'Manrope',sans-serif;color:var(--t);background:var(--c);margin-bottom:10px;outline:none;}.inp:focus{border-color:var(--g);}.inp::placeholder{color:var(--tl);}.row{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;}.btn{padding:11px 24px;border-radius:var(--rs);font-size:14px;font-weight:600;font-family:'Manrope',sans-serif;cursor:pointer;border:1.5px solid var(--b);background:var(--c);color:var(--tm);}.btn:hover{background:#F0F0EC;}.btn:disabled{opacity:.3;cursor:not-allowed;}.btn.p{background:var(--g);color:#fff;border-color:var(--g);}.btn.p:hover{background:var(--gd);}.res{text-align:center;padding:1rem 0;}.ri{font-size:58px;margin-bottom:.75rem;}.re{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tl);margin-bottom:.35rem;}.rr{font-size:26px;font-weight:700;color:var(--gp);margin-bottom:1rem;line-height:1.2;}.rd{font-size:14px;color:var(--tm);line-height:1.7;max-width:420px;margin:0 auto 1.5rem;}.tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:1.75rem;}.tag{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--gl);color:var(--gd);}.chip{background:var(--c);border:1.5px solid var(--b);border-radius:var(--r);padding:1.25rem 1.5rem;max-width:400px;margin:0 auto 1.5rem;font-size:13px;color:var(--tm);line-height:1.7;text-align:left;}.chip strong{color:var(--t);font-weight:600;}.cl{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--b);font-family:monospace;font-size:12px;color:var(--gd);}.ss{font-size:11px;color:var(--tl);text-align:center;margin-top:.5rem;min-height:18px;}.ss.ok{color:var(--g);}.rb{font-size:13px;color:var(--tl);background:none;border:none;cursor:pointer;text-decoration:underline;font-family:'Manrope',sans-serif;}.si2{animation:fu .25s ease;}@keyframes fu{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}.rv{animation:rv2 .4s ease both;}.rv:nth-child(2){animation-delay:.05s;}.rv:nth-child(3){animation-delay:.1s;}.rv:nth-child(4){animation-delay:.15s;}.rv:nth-child(5){animation-delay:.2s;}.rv:nth-child(6){animation-delay:.25s;}@keyframes rv2{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}</style></head><body><div class="w"><div class="hdr"><div class="logo"><span class="dot"></span>Spendbase</div><span class="si" id="ct">1 / 14</span></div><div class="pb"><div class="pf" id="pg" style="width:7%"></div></div><div id="bd"></div></div><script>const U="https://script.google.com/macros/s/AKfycbymv1llDoSFYkyJarAuOjrvW1xY1-5TJUMG0BMOEw0wpH54oq60O8qQDfVIeXv50roJyg/exec";const Q=[{id:"contact",type:"contact",block:"Старт",q:"Привіт! Як тебе звати?",sub:"Залиш контакт — рекрутер напише особисто.",fields:[{id:"nm",ph:"Ім'я та прізвище"},{id:"tg",ph:"Telegram або email"}]},{id:"groupchat",type:"single",block:"Хто ти є",cols:2,q:"Який ти в груповому проєкті?",sub:"Просто впізнай себе.",opts:[{i:"📋",t:"Створюю чат і призначаю ролі",d:"Організатор",v:"pm"},{i:"🔇",t:"Мовчу але здаю найкраще",d:"Тихий виконавець",v:"deep"},{i:"💡",t:"Генерую 100 ідей і зникаю",d:"Натхнення є",v:"creative"},{i:"🚒",t:"Приходжу в останній момент",d:"І рятую все",v:"action"}]},{id:"desk",type:"single",block:"Хто ти є",cols:2,q:"Твій робочий стіл?",sub:"Чесно.",opts:[{i:"🌪️",t:"Хаос але знаю де що лежить",d:"Своя система",v:"chaos"},{i:"🗂️",t:"Все по папках",d:"Без структури — не людина",v:"system"},{i:"⬜",t:"Мінімалізм",d:"Менше відволікань",v:"minimal"},{i:"🎲",t:"Залежить від настрою",d:"Сьогодні чисто",v:"mood"}]},{id:"newstuff",type:"single",block:"Хто ти є",cols:2,q:"Нова крута штука. Перший крок?",sub:"Як ти насправді.",opts:[{i:"🔎",t:"Гугл + читаю все підряд",d:"Спершу зрозуміти",v:"research"},{i:"💬",t:"Питаю друга",d:"Є живий досвід",v:"social"},{i:"⚡",t:"Одразу встановлюю і тикаю",d:"Навчання — руками",v:"action"},{i:"▶️",t:"YouTube відео на 2х",d:"Огляд за 7 хвилин",v:"video"}]},{id:"ai1",type:"single",block:"AI блок",cols:2,q:"ChatGPT написав тобі текст. Ти:",sub:"Як реально.",opts:[{i:"📤",t:"Відправляю як є",d:"Навіщо витрачати час",v:"pragmatic"},{i:"✏️",t:"Переписую повністю",d:"Не моє — не відправляю",v:"ownership"},{i:"🎨",t:"Беру ідею роблю своє",d:"AI — відправна точка",v:"creative_ai"},{i:"🔍",t:"Спершу факт-чекаю",d:"Довіряй але перевіряй",v:"critical"}]},{id:"ai2",type:"single",block:"AI блок",cols:2,q:"AI vs ти?",sub:"Без правильної відповіді.",opts:[{i:"🧑",t:"Я краще",d:"AI не розуміє нюансів",v:"human"},{i:"🤖",t:"AI краще в рутині",d:"Ділимо ролі",v:"hybrid"},{i:"👀",t:"Поки що я але слідкую",d:"Все змінюється",v:"watching"},{i:"🤝",t:"Це не конкуренція",d:"Залежить від задачі",v:"pragmatic_ai"}]},{id:"ai3",type:"single",block:"AI блок",cols:2,q:"Яку частину навчання віддав AI?",sub:"Без осуду.",opts:[{i:"📝",t:"Конспекти лекцій",d:"AI запише",v:"notes"},{i:"📚",t:"Пошук літератури",d:"Найнудніша частина",v:"search"},{i:"📐",t:"Оформлення",d:"Шрифти — не моє",v:"format"},{i:"🚫",t:"Нічого",d:"Хочу розуміти сам",v:"none"}]},{id:"freedom",type:"single",block:"Як ти думаєш",cols:2,q:"Тобі кажуть зроби що хочеш. Реакція?",sub:"Внутрішня.",opts:[{i:"🚀",t:"Нарешті! Одразу маю ідею",d:"Свобода — мій режим",v:"autonomous"},{i:"📏",t:"Які критерії успіху?",d:"Без рамок незручно",v:"structured"},{i:"🔍",t:"Подивлюсь що є",d:"Навіщо винаходити велосипед",v:"research2"},{i:"😬",t:"Страшно але цікаво",d:"Відповідальність і драйвить",v:"honest"}]},{id:"drive",type:"single",block:"Як ти думаєш",cols:2,q:"Що тебе більше драйвить?",sub:"Обери одне.",opts:[{i:"⚙️",t:"Бачити як щось працює",d:"Зробив — і воно живе",v:"builder"},{i:"💡",t:"Придумати нове рішення",d:"Нові ідеї — моє паливо",v:"innovator"},{i:"🎓",t:"Пояснити складне просто",d:"Коли зрозуміла — перемога",v:"teacher"},{i:"🎯",t:"Переконати змінити думку",d:"Вплив на людей",v:"influencer"}]},{id:"feedback",type:"single",block:"Як ти думаєш",cols:2,q:"Ідеальний фідбек?",sub:"Що реально допомагає.",opts:[{i:"🔧",t:"Конкретно що не так", ontent=(cur+1)+" / "+Q.length;let h="";if(q.type==="contact"){h='<span class="bb">'+q.block+'</span><h2 class="qt">'+q.q+'</h2><p class="qs">'+q.sub+'</p>';h+=q.fields.map(f=>'<input class="inp" id="'+f.id+'" placeholder="'+f.ph+'" autocomplete="off"/>').join("");h+='<div class="row"><span></span><button class="btn p" onclick="next()">Поїхали</button></div>';}else{const cc=q.cols===2?"opts two":"opts";h='<span class="bb">'+q.block+'</span><h2 class="qt">'+q.q+'</h2><p class="qs">'+q.sub+'</p><div class="'+cc+'">';h+=q.opts.map(o=>'<div class="opt'+(ans[q.id]===o.v?" sel":"")+'" onclick="pick(''+q.id+'',''+o.v+'',this)"><span class="oi">'+o.i+'</span><div><div class="ot">'+o.t+'</div><div class="od">'+o.d+'</div></div></div>').join("");h+='</div><div class="row"><button class="btn" onclick="back()" '+(cur===0?"disabled":"")+'>Назад</button><button class="btn p" id="nb" onclick="next()" '+(ans[q.id]?"":"disabled")+'>Далі</button></div>';}document.getElementById("bd").innerHTML='<div class="si2">'+h+'</div>';if(q.type==="contact"){const nm=document.getElementById("nm"),tg=document.getElementById("tg");nm.value=co.nm;tg.value=co.tg;nm.addEventListener("input",e=>co.nm=e.target.value);tg.addEventListener("input",e=>co.tg=e.target.value);}}function pick(qid,val,el){ans[qid]=val;document.querySelectorAll(".opt").forEach(c=>c.classList.remove("sel"));el.classList.add("sel");const nb=document.getElementById("nb");if(nb)nb.disabled=false;setTimeout(()=>next(),280);}function next(){if(Q[cur].type==="contact"){co.nm=document.getElementById("nm").value||"";co.tg=document.getElementById("tg").value||"";}if(cur<Q.length-1){cur++;render();}else showResult();}function back(){if(cur>0){cur--;render();}}function save(p){fetch(U,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}).then(()=>{const el=document.getElementById("ss");if(el){el.textContent="Збережено";el.className="ss ok";}}).catch(()=>{});}function showResult(){document.getElementById("pg").style.width="100%";document.getElementById("ct").textContent="Done";const p=gP(ans);const name=co.nm?co.nm.split(" ")[0]:"друже";const sm={now:"Готовий стартувати вже зараз.",soon:"Стартуєш за 1-3 місяці.",later:"Плануєш після диплому.",explore:"Поки дивишся."};document.getElementById("bd").innerHTML='<div class="res si2"><div class="ri rv">'+p.i+'</div><p class="re rv">Твій профіль у Spendbase</p><div class="rr rv">'+p.r+'</div><p class="rd rv">'+p.d+'</p><div class="tags rv">'+p.t.map(t=>'<span class="tag">'+t+'</span>').join("")+'</div><div class="chip rv"><strong>'+name+'</strong>, твій профіль збережено.<br>'+(sm[ans.start]||"")+'<br><br>'+(co.tg?'Напишемо на <span class="cl">'+co.tg+'</span> і підберемо роль.':"Залиш контакт на стенді")+'</div><div id="ss" class="ss rv">Зберігаємо...</div><button class="rb rv" onclick="restart()">Пройти ще раз</button></div>';save({name:co.nm,contact:co.tg,profile:p.r,start:ans.start,groupchat:ans.groupchat,drive:ans.drive,superpower:ans.superpower});}function restart(){cur=0;ans={};co={nm:"",tg:""};render();}render();</script></body></html>
