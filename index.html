function render(){var q=Q[cur];document.body.setAttribute("data-bg",q.type=="contact"?"tint":"white");document.getElementById("pg").style.width=((cur+1)/Q.length*100)+"%";document.getElementById("ct").textContent=(cur+1)+" / "+Q.length;var h="";if(q.type=="contact"){h="<span class=\"bb\">"+q.block+"</span><h2 class=\"qt\">"+hlLast(q.q)+"</h2><p class=\"qs\">"+q.sub+"</p>";h+=q.fields.map(function(f){return "<input class=\"inp\" id=\""+f.id+"\" placeholder=\""+f.ph+"\" autocomplete=\"off\"/>";}).join("");h+="<div class=\"row\"><span></span><button class=\"btn p\" onclick=\"next()\">Поїхали</button></div>";}else{var cc=q.cols==2?"opts two":"opts";h="<span class=\"bb\">"+q.block+"</span><h2 class=\"qt\">"+(q.hlw?hlWord(q.q,q.hlw):hlLast(q.q))+"</h2><p class=\"qs\">"+q.sub+"</p><div class=\""+cc+"\">"; h+=q.opts.map(function(o){var sel=ans[q.id]==o.v?" sel":"";return "<div class=\"opt"+sel+"\" data-qid=\""+q.id+"\" data-v=\""+o.v+"\" onclick=\"pick(this)\"><span class=\"oi\">"+o.i+"</span><div><div class=\"ot\">"+o.t+"</div><div class=\"od\">"+o.d+"</div></div></div>";}).join("");h+="</div><div class=\"row\"><button class=\"btn\" onclick=\"back()\" "+(cur==0?"disabled ":"")+">Назад</button></div>";}document.getElementById("bd").innerHTML="<div class=\"si2\">"+h+"</div>";if(q.type=="contact"){var nm=document.getElementById("nm"),tg=document.getElementById("tg");nm.value=co.nm;tg.value=co.tg;nm.onchange=function(e){co.nm=e.target.value;};tg.onchange=function(e){co.tg=e.target.value;};nm.oninput=function(e){co.nm=e.target.value;};tg.oninput=function(e){co.tg=e.target.value;};}}
function pick(el){var qid=el.dataset.qid,val=el.dataset.v;ans[qid]=val;var opts=document.querySelectorAll(".opt");for(var i=0;i<opts.length;i++){opts[i].classList.remove("sel");}el.classList.add("sel");var nb=document.getElementById("nb");if(nb){nb.disabled=false;}setTimeout(function(){next();},280);}
function next(){if(Q[cur].type=="contact"){co.nm=document.getElementById("nm").value||"";co.tg=document.getElementById("tg").value||"";}if(cur<Q.length-1){cur++;render();}else{showResult();}}
function back(){if(cur>0){cur--;render();}}
function labelFor(qid,val){var q=Q.filter(function(x){return x.id==qid;})[0];if(!q||!q.opts)return val;var o=q.opts.filter(function(x){return x.v==val;})[0];return o?o.t:val;}

function showResult(){document.body.setAttribute("data-bg","tint");document.getElementById("illuBg").style.display="none";document.getElementById("pg").style.width="100%";document.getElementById("ct").textContent="Done";var p=gP(ans);var name=co.nm?co.nm.split(" ")[0]:"друже";var rParts=p.r.split(" — ");var rTitle=rParts.length>1?hl(rParts[0])+" — "+rParts[1]:hlLast(p.r);var r="<div class=\"res si2\"><div class=\"ri rv\">"+p.i+"</div><p class=\"re rv\">Твій профіль у Spendbase</p><div class=\"rr rv\">"+rTitle+"</div><p class=\"rd rv\">"+p.d+"</p><div class=\"tags rv\">";p.t.forEach(function(t){r+="<span class=\"tag\">"+t+"</span>";});r+="</div><div class=\"chip rv\"><strong>"+name+"</strong>, твій профіль збережено.<br><br>"+(co.tg?"Напишемо на <span class=\"cl\">"+co.tg+"</span> і підберемо роль.<br>А поки — переглянь наші <a href=\"https://spendbase.peopleforce.io/careers\" target=\"_blank\" style=\"color:#175CD3;font-weight:700;text-decoration:underline;\">відкриті вакансії</a>.":"Переглянь наші <a href=\"https://spendbase.peopleforce.io/careers\" target=\"_blank\" style=\"color:#175CD3;font-weight:700;text-decoration:underline;\">відкриті вакансії</a>.")+"</div><div id=\"ss\" class=\"ss rv\">Зберігаємо...</div><button class=\"rb rv\" onclick=\"restart()\">Пройти ще раз</button></div>";document.getElementById("bd").innerHTML=r;save({name:co.nm,contact:co.tg,profile:p.r,start:labelFor("start",ans.start),groupchat:labelFor("groupchat",ans.groupchat),drive:labelFor("drive",ans.drive),superpower:labelFor("superpower",ans.superpower),ai_learning:labelFor("ai3",ans.ai3),ai_stack:labelFor("aistack",ans.aistack),banking:labelFor("banking",ans.banking),english:labelFor("english",ans.english)});}
